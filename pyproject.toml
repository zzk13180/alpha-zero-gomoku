[project]
name = "alpha-zero-gomoku"
version = "0.1.0"
description = "A simplified AlphaZero implementation for Gomoku (Five-in-a-Row)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["alphazero", "gomoku", "reinforcement-learning", "mcts", "deep-learning"]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
]

[tool.ruff]
# 设定目标 Python 版本
target-version = "py310"

# 单行最大字符数限制
line-length = 100

[tool.ruff.lint]
# 启用的规则列表:
# E   : pycodestyle 错误 - 标准 PEP8 代码风格错误检查
# W   : pycodestyle 警告 - 标准 PEP8 代码风格警告
# F   : Pyflakes - 逻辑错误检测，如未使用的变量、未定义的名称等
# I   : isort - 导入语句的排序和整理，确保 import 顺序一致
# UP  : pyupgrade - 自动将旧语法升级为新版本语法，如 type() -> isinstance()
# B   : flake8-bugbear - 发现潜在的 Bug 和不良设计模式
# C4  : flake8-comprehensions - 优化列表/字典/集合推导式的写法
# SIM : flake8-simplify - 代码简化建议，减少不必要的复杂性
# TC  : flake8-type-checking - 类型检查相关的导入优化（TYPE_CHECKING 块）
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TC"]

# 忽略的规则列表:
# E501: 行太长 - 由 formatter 自动处理，不需要作为 lint 报错
# E203: 冒号前的空格 - 在切片操作 a[1 : 2] 中可能出现，与 Black 格式化兼容
# B008: 函数参数默认值中调用函数 - 在 FastAPI 的 Depends() 等框架中常用
ignore = ["E501", "E203", "B008"]

[tool.ruff.lint.isort]
# 将项目内的包视为"第一方"包
# 这确保它们在 import 排序时被正确分组到第一方区域
# 导入顺序: 标准库 -> 第三方库 -> 第一方库 -> 本地导入
known-first-party = ["game", "model"]

[tool.ruff.format]
# 字符串引号风格: "double" 使用双引号，"single" 使用单引号
# 推荐使用双引号以保持与 Black 格式化器的兼容性
quote-style = "double"

# 缩进风格: "space" 使用空格，"tab" 使用制表符
# Python 社区标准推荐使用 4 个空格缩进
indent-style = "space"

# 行尾换行符: "auto" 自动检测，"lf" Unix 风格，"crlf" Windows 风格
# 使用 "auto" 可以自动适应不同操作系统
line-ending = "auto"

# ============================================================================
# Pyright 配置 - Python 静态类型检查器 (VS Code Pylance 使用)
# 官方文档: https://microsoft.github.io/pyright/
# ============================================================================
[tool.pyright]
# 包含在类型检查中的目录
# 指定项目的主要源代码目录
include = ["game", "model", "scripts"]

# 排除在类型检查之外的目录
# 排除依赖、缓存、构建输出等非源代码目录
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "venv",
    ".venv",
    "**/build",
    "**/dist"
]

# 类型检查严格程度:
# - "off": 禁用类型检查
# - "basic": 基础检查，适合逐步引入类型标注的项目
# - "standard": 标准检查，推荐用于新项目
# - "strict": 严格检查，要求完整的类型标注
typeCheckingMode = "basic"

# 目标 Python 版本，影响可用的类型特性
pythonVersion = "3.10"

# 额外的模块查找路径
# 添加项目根目录，使得可以直接 import game, model 等包
extraPaths = ["."]

# 执行环境配置
# 定义不同目录的 Python 环境设置
executionEnvironments = [
    { root = "." }
]

